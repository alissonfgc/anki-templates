<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiente de Desenvolvimento - Anki</title>
    
    <link rel="stylesheet" href="../Card-Certo_Errado/estilo.css">
    
    <style>
        /* CSS EXTRA SÓ PARA O AMBIENTE DE TESTE (Para centralizar e dar fundo) */
        body { background-color: #2f2f31; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .test-container { width: 90%; max-width: 600px; }
    </style>
    </head>
<body>

    <div class="test-container">
        
        <div class="card" id="card_teste_1">
            !!Cuidado! A banca costuma trocar "defeso" por "permitido".
        </div>
        <br>
        
        <div class="card" id="card_teste_2">
            $$Art. 5º CF | Todos são iguais perante a lei, sem distinção de qualquer natureza.
        </div>

    </div>

    <script>
        // Função para processar os atalhos em um elemento específico
        function processarAtalhos(idElemento) {
            var campo = document.getElementById(idElemento);
            if (!campo) return; // Segurança caso o elemento não exista

            var conteudo = campo.innerHTML.trim();

            // --- 1. ATALHO DE ALERTA (!!) ---
            if (conteudo.startsWith("!!")) {
                var texto = conteudo.substring(2).trim();
                var html = `
                    <div class="alert-card alert-danger">
                        <div class="alert-card__bar"></div>
                        <div class="alert-card__icon">️!</div>
                        <div class="alert-card__text">${texto}</div>
                    </div>`;
                campo.innerHTML = html;
            }

            // --- 2. ATALHO DE LEI ($$) ---
            // Suporta formato: "$$Título | Conteúdo" ou apenas "$$Conteúdo"
            else if (conteudo.startsWith("$$")) {
                var textoBruto = conteudo.substring(2).trim();
                var partes = textoBruto.split("|");
                
                var titulo = "⚖️ Legislação / Entendimento"; // Título Padrão
                var corpo = textoBruto;

                // Se o usuário usou a barra vertical "|" para separar título
                if (partes.length > 1) {
                    titulo = "⚖️ " + partes[0].trim();
                    corpo = partes.slice(1).join("|").trim(); // Junta o resto caso tenha mais pipes
                }

                var html = `
                    <details class="glass-details">
                        <summary class="glass-summary">${titulo}</summary>
                        <div class="glass-body">${corpo}</div>
                    </details>`;
                campo.innerHTML = html;
            }
        }

        // --- EXECUÇÃO ---
        // No Anki real, você chamará sem ID, ou usará o ID dos campos.
        // Aqui chamamos para os dois exemplos de teste:
        processarAtalhos("card_teste_1");
        processarAtalhos("card_teste_2");
    </script>

</body>
</html>
