<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Final - Card Dark Pro</title>
    
    <style>
        /* ================================================= */
        /* 1. O SEU CSS (Copiado exatamente como enviou)    */
        /* ================================================= */

        /* ATALHOS REAPROVEITÁVEIS */
        .txt-green { color:#32a852; }
        .txt-red   { color:#d13242; }
        .txt-blue  { color:#323dd1; }

        /* Details “vidro” genéricos */
        .glass-details {
            width:100%;
            border-radius:14px;
            padding:0;
            margin:8px 0;
            background:rgba(255,255,255,0.55);
            backdrop-filter:blur(12px) saturate(160%);
            -webkit-backdrop-filter:blur(12px) saturate(160%);
            border:1px solid rgba(255,255,255,0.45);
            box-shadow:0 6px 14px rgba(0,0,0,0.18);
            overflow:hidden;
            text-align: left; /* Garante alinhamento interno */
        }
        .glass-summary {
            font-size:1.1em;
            font-weight:700;
            padding:10px 14px;
            text-align:center;
            cursor:pointer;
            list-style:none;
            color:#111;
            background:rgba(255,255,255,0.25);
        }
        /* Remove a seta padrão do details em alguns navegadores */
        .glass-summary::-webkit-details-marker { display: none; }

        .glass-body {
            padding:12px 18px 14px;
            font-size:15px;
            line-height:1.48;
            color:#000;
            text-align:justify;
        }

        /* Alert cards reutilizáveis */
        .alert-card{
            position:relative;
            display:flex;
            align-items:center;
            width:100%;
            padding:14px 16px;
            border-radius:12px;
            background:#1a1f66;
            box-shadow:0 6px 16px rgba(0,0,0,.08);
            color:#bfe4ff;
            font-weight:700;
            margin:8px 0;
            text-align: left;
        }
        .alert-card__bar{
            position:absolute;
            left:0; top:0; bottom:0;
            width:8px;
            background:#55a9ff;
            border-radius:12px 0 0 12px;
        }
        .alert-card__icon{
            flex:0 0 auto;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:28px; height:28px;
            margin-left:12px;
            color:inherit;
            background:rgba(142,203,255,.15);
            border:2px solid #8ecbff;
            border-radius:50%;
            font-family:inherit;
        }
        .alert-card__text{
            margin:0 0 0 12px;
            color:#9fd6ff;
            line-height:1.25;
            font-size:1rem;
        }
        .alert-danger{
            background:#6b1111;
        }
        .alert-danger .alert-card__bar{
            background:#e74c3c;
        }
        .alert-danger .alert-card__text{
            color:#ffd6d1;
        }

        /* TEMA DARK PRO BASE */
        .card {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            font-size: 18px;
            text-align: center;
            color: #f0f0f0;
            background-color: #646464;
            /* SVG Background simplificado para o teste não ficar pesado */
            background-image: radial-gradient(#777 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            min-height: 100vh;
        }

        .container-geral {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 18px;
            background: rgba(26, 28, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="container-geral" id="campo_teste">
            
            !!Cuidado! Isso é uma pegadinha da banca.
            <br><br>
            $$Art. 5º CF | Todos são iguais perante a lei, sem distinção de qualquer natureza.
            <br><br>
            jjSúmula Vinculante 10 | A cláusula de reserva de plenário deve ser respeitada.
            <br><br>
            Texto normal com vvpalavra verdevv e aaazul aqui aa.

        </div>
    </div>

    <script>
        // SCRIPT CORRIGIDO - VERSÃO ROBUSTA
        (function() {
            var el = document.getElementById("campo_teste");
            if (!el) return;

            // 1. Pega o HTML original
            var htmlOriginal = el.innerHTML;

            // 2. Divide em linhas baseadas no <br>
            // O regex considera <br>, <br/>, <br /> e quebras de linha reais (\n)
            var linhas = htmlOriginal.split(/<br\s*\/?>|\n/gi);

            // 3. Processa cada linha
            var novoHtml = linhas.map(function(linha) {
                // Remove tags HTML para ler o comando limpo (evita sujeira do editor)
                var textoPuro = linha.replace(/<[^>]*>/g, "").trim();
                
                if (textoPuro.length === 0) return "<br>"; // Mantém espaçamento

                // --- ATALHO LEI ($$) ---
                if (textoPuro.startsWith("$$")) {
                    var conteudo = textoPuro.substring(2).trim();
                    var partes = conteudo.split("|");
                    var titulo = "⚖️ Letra de Lei";
                    var corpo = conteudo;

                    if (partes.length > 1) {
                        titulo = "⚖️ " + partes[0].trim();
                        corpo = partes.slice(1).join("|").trim();
                    }

                    // Montagem segura da string HTML
                    return `
                    <details class="glass-details">
                        <summary class="glass-summary">${titulo}</summary>
                        <div class="glass-body">${corpo}</div>
                    </details>`;
                }

                // --- ATALHO JURISPRUDÊNCIA (jj) ---
                if (textoPuro.startsWith("jj")) {
                    var conteudo = textoPuro.substring(2).trim();
                    var partes = conteudo.split("|");
                    var titulo = "👨🏻‍⚖️ Entendimento do STF";
                    var corpo = conteudo;

                    if (partes.length > 1) {
                        titulo = "👨🏻‍⚖️ " + partes[0].trim();
                        corpo = partes.slice(1).join("|").trim();
                    }

                    return `
                    <details class="glass-details">
                        <summary class="glass-summary">${titulo}</summary>
                        <div class="glass-body">${corpo}</div>
                    </details>`;
                }

                // --- ATALHO ALERTA (!!) ---
                if (textoPuro.startsWith("!!")) {
                    var texto = textoPuro.substring(2).trim();
                    return `
                    <div class="alert-card alert-danger">
                        <div class="alert-card__bar"></div>
                        <div class="alert-card__icon">⚠️</div>
                        <div class="alert-card__text">${texto}</div>
                    </div>`;
                }

                // Se não for atalho, retorna a linha original (com suas tags HTML se tiver)
                return linha;

            }).join(""); // Junta tudo sem adicionar <br> extras, pois já tratamos

            // --- 4. CORES (Processado no final sobre todo o HTML) ---
            novoHtml = novoHtml.replace(/vv(.*?)vv/g, '<span class="txt-green" style="font-weight:bold;">$1</span>');
            novoHtml = novoHtml.replace(/aa(.*?)aa/g, '<span class="txt-blue" style="font-weight:bold;">$1</span>');
            
            // Aplica ao elemento
            el.innerHTML = novoHtml;
        })();
    </script>

</body>
</html>
