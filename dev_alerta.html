<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Alerta Anki</title>
    
    <style>
        /* 1. SIMULAÇÃO DO AMBIENTE ANKI (Apenas para teste no Spck) */
        body {
            background-color: #2f2f31; /* Fundo escuro padrão do Anki */
            color: white;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 20px;
        }

        /* 2. O CSS DO SEU CARTÃO (Copie isso para o Anki depois) */
        .card {
            font-size: 20px;
            line-height: 1.5;
        }

        /* Estilo do Container do Alerta */
        .alert-card {
            display: flex;
            align-items: stretch;
            background-color: rgba(220, 53, 69, 0.15); /* Vermelho translúcido */
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        /* Barra lateral vermelha */
        .alert-card__bar {
            width: 6px;
            background-color: #dc3545; /* Vermelho Bootstrap */
        }

        /* Área do ícone */
        .alert-card__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            font-size: 24px;
            font-weight: bold;
            color: #dc3545;
        }

        /* Texto do alerta */
        .alert-card__text {
            padding: 12px 15px 12px 0;
            color: #ffb3b3; /* Texto vermelho claro para contraste */
            flex: 1; /* Ocupa o resto do espaço */
        }
    </style>
</head>
<body>

    <div id="frente" class="card">
        !!Cuidado! Esta é uma pegadinha clássica da banca CESPE.
    </div>

    <script>
        // Função que roda assim que o cartão carrega
        (function() {
            var campo = document.getElementById("frente");
            
            // Pega o conteúdo atual
            var conteudo = campo.innerHTML.trim();

            // Lógica do Atalho "!!"
            if (conteudo.startsWith("!!")) {
                // Remove o "!!"
                var textoLimpo = conteudo.substring(2).trim();

                // Cria o HTML do Alerta (Template String)
                var htmlAlerta = `
                    <div class="alert-card alert-danger">
                        <div class="alert-card__bar"></div>
                        <div class="alert-card__icon">⚠️</div>
                        <div class="alert-card__text">${textoLimpo}</div>
                    </div>
                `;

                // Substitui o texto simples pelo HTML bonito
                campo.innerHTML = htmlAlerta;
            }
        })();
    </script>

</body>
</html>
