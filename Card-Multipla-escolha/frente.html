<script>
// grava resposta pela LETRA ORIGINAL (A–E), mesmo embaralhado
function registrarRespostaMC(letraOriginal, botao) {
  if (window.Persistence && Persistence.isAvailable()) {
    // salva em duas chaves para compatibilidade com o verso
    Persistence.setItem('user_answer_mc', letraOriginal);
    Persistence.setItem('user_answer', letraOriginal);
  }
  // feedback visual
  var botoes = document.querySelectorAll('.mc-botao');
  botoes.forEach(function(b){ b.classList.remove('selecionado'); });
  if (botao) botao.classList.add('selecionado');
}

window.addEventListener('load', function () {
  var container = document.querySelector('.mc-opcoes');
  if (!container) return;

  var botoes = Array.from(container.querySelectorAll('.mc-botao'));

  // Remove alternativas cujo texto está vazio
  var ativos = botoes.filter(function(btn){
    var txtSpan = btn.querySelector('.mc-texto');
    if (!txtSpan) return false;
    var txt = (txtSpan.textContent || txtSpan.innerText || "").replace(/\s+/g, '');
    return txt.length > 0;
  });

  // Embaralha (Fisher–Yates)
  for (var i = ativos.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = ativos[i];
    ativos[i] = ativos[j];
    ativos[j] = tmp;
  }

  // Remonta container e renumera rótulo VISUAL A), B), C)...
  var letrasVisiveis = ['A','B','C','D','E'];
  container.innerHTML = '';
  ativos.forEach(function(btn, idx){
    var label = btn.querySelector('.mc-letra');
    if (label) label.textContent = letrasVisiveis[idx] + ')';
    container.appendChild(btn);
  });

  // Restaura opção já marcada (se houver)
  if (window.Persistence && Persistence.isAvailable()) {
    var letraSalva = Persistence.getItem('user_answer_mc') || Persistence.getItem('user_answer');
    if (letraSalva) {
      var btnSalvo = container.querySelector('.mc-botao[data-letra-original="'+ letraSalva +'"]');
      if (btnSalvo) btnSalvo.classList.add('selecionado');
    }
  }
});
</script>
