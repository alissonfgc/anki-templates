<div class="card"> <!-- Temporário -->

<div class="container-geral">

  <div class="card-header">
    {{Disciplina}}
  </div>

  <div class="texto-frente">
    {{Frente}}
  </div>

  <div id="resultado" class="resposta"></div>

  <div class="titulo-assunto">
    {{Assunto da questão}}
  </div>

  <div class="explicacao">
    {{Explicação}}
  </div>

  <div class="link-questao">
    <a href="{{Link da questão}}" target="_blank">Link da questão</a>
  </div>

  <div class="logos-container">
    <a href="https://www.tecconcursos.com.br" target="_blank">
      <img src="https://cdn.tecconcursos.com.br/blog/img/logo-coordenacao.png" class="logo-site">
    </a>
    <a href="https://www.qconcursos.com" target="_blank">
      <img src="https://odin.qconcursos.com/packs/assets/qc-afe3db90abed2de7f6ed.svg" class="logo-site">
    </a>
  </div>

  <!-- ALTERNATIVAS ESCONDIDAS: USADAS PARA MOSTRAR O TEXTO DA CORRETA -->
  <div id="mc-alternativas-hidden" class="hidden">
    <div data-letra="A">{{Alternativa A}}</div>
    <div data-letra="B">{{Alternativa B}}</div>
    <div data-letra="C">{{Alternativa C}}</div>
    <div data-letra="D">{{Alternativa D}}</div>
    <div data-letra="E">{{Alternativa E}}</div>
  </div>

</div>

</div>

<script>
(function () {
  var resp = null;

  if (window.Persistence && Persistence.isAvailable()) {
    // tenta primeiro a chave nova, depois a antiga
    resp = Persistence.getItem('user_answer_mc') || Persistence.getItem('user_answer');
    Persistence.clear();
  }

  var resultadoDiv = document.getElementById('resultado');

  // ===== Normaliza GABARITO (A, B, C, D, E) =====
  var gRaw   = "{{Gabarito}}";
  var gMatch = gRaw.toString().toLowerCase().match(/[a-e]/);
  var letraGab = gMatch ? gMatch[0].toUpperCase() : null;

  // ===== Normaliza RESPOSTA DO USUÁRIO =====
  var letraResp = null;
  if (resp !== null && resp !== undefined) {
    var s = String(resp).trim();
    // Se for número 0–4, converte para A–E (compatibilidade)
    if (/^[0-4]$/.test(s)) {
      var idx = parseInt(s, 10);
      letraResp = "ABCDE".charAt(idx);
    } else {
      var m = s.toLowerCase().match(/[a-e]/);
      if (m) letraResp = m[0].toUpperCase();
    }
  }

  var txtGab  = letraGab ? ("Alternativa " + letraGab) : "Indefinido";
  var txtResp = letraResp ? ("Alternativa " + letraResp) : "Nenhuma";

  // ===== MENSAGEM PRINCIPAL =====
  if (!letraResp) {
    resultadoDiv.innerHTML =
      '<div class="resposta-principal">Não marcou</div>' +
      '<div class="resposta-detalhe">Gabarito: ' + txtGab + '</div>';
    resultadoDiv.classList.add('resposta-errada');
  } else {
    var acertou = (letraGab && letraResp && letraGab === letraResp);

    if (acertou) {
      resultadoDiv.innerHTML =
        '<div class="resposta-principal">Correto!</div>' +
        '<div class="resposta-detalhe">Sua resposta: ' + txtResp + ' · Gabarito: ' + txtGab + '</div>';
      resultadoDiv.classList.add('resposta-correta');

      // Animação foguete
      var anim = document.getElementById('animacao-acerto');
      if (anim) {
        anim.classList.remove('mostrar');
        void anim.offsetWidth;
        anim.classList.add('mostrar');
      }
    } else {
      resultadoDiv.innerHTML =
        '<div class="resposta-principal">Você errou</div>' +
        '<div class="resposta-detalhe">Sua resposta: ' + txtResp + ' · Gabarito: ' + txtGab + '</div>';
      resultadoDiv.classList.add('resposta-errada');
    }
  }

  // ===== BLOCO EXTRA COM TEXTO DA ALTERNATIVA CORRETA =====
  if (letraGab) {
    var hidden = document.getElementById('mc-alternativas-hidden');
    if (hidden) {
      var corretaNode = hidden.querySelector('[data-letra="' + letraGab + '"]');
      if (corretaNode) {
        // pega o HTML da alternativa (mantém negrito, etc)
        var textoCorreta = corretaNode.innerHTML || '';
        // ignora se estiver completamente vazia
        var checkVazio = textoCorreta.replace(/<[^>]*>/g,'').replace(/\s+/g,'');
        if (checkVazio.length > 0) {
          var blocoExtra =
            '<div class="gabarito-extra">' +
              '<div class="gabarito-extra-icone">✔</div>' +
              '<div class="gabarito-extra-texto">' +
                '<div class="gabarito-extra-texto-rotulo">Alternativa correta (' + letraGab + ')</div>' +
                '<div>' + textoCorreta + '</div>' +
              '</div>' +
            '</div>';
          resultadoDiv.insertAdjacentHTML('afterend', blocoExtra);
        }
      }
    }
  }
})();
</script>
