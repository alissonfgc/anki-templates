<div class="card">
<div class="container-geral">

  <div class="card-header">
    {{Disciplina}}
  </div>

  <div class="texto-frente">
    {{Frente}}
  </div>

  <div class="ce-opcoes">
    <button class="ce-botao" onclick="registrarResposta(1, this)">Certo</button>
    <button class="ce-botao" onclick="registrarResposta(0, this)">Errado</button>

  </div>

    </a>
  </div>

</div>

<script>
function registrarResposta(valor, botao) {
  // grava a resposta do usuário (1 = Certo, 0 = Errado)
  if (window.Persistence && Persistence.isAvailable()) {
    Persistence.setItem('user_answer', valor);
  }

  // feedback visual: destaca o botão clicado
  var botoes = document.querySelectorAll('.ce-botao');
  botoes.forEach(function(b){ b.classList.remove('selecionado'); });
  if (botao) {
    botao.classList.add('selecionado');
  }
}

// quando carregar a frente de novo (rever a carta por exemplo),
// mantém o botão que foi marcado anteriormente
window.addEventListener('load', function () {
  if (!(window.Persistence && Persistence.isAvailable())) return;
  var valor = Persistence.getItem('user_answer');
  if (valor === null || valor === undefined) return;
  var seletor = '.ce-botao:nth-child(' + (valor == 1 ? '1' : '2') + ')';
  var botao = document.querySelector(seletor);
  if (botao) botao.classList.add('selecionado');
});
</script>
